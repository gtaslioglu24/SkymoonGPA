<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Skymoon GPA — Koç Üniversitesi not ortalaması hesaplama</title>
    <meta
      name="description"
      content="Koç Üniversitesi GPA hesaplama, simülasyon ve not projeksiyonu. Bu dönem alacağın notlara göre genel not ortalamanın (CGPA) nasıl değişeceğini anında gör."
    />

    <!--
      Applies the saved theme before first paint. In a file of its own rather
      than inline so the page needs no 'unsafe-inline' in its script-src.
    -->
    <script src="/theme.js"></script>

    <!--
      canonical, hreflang, og:url and og:image are injected at build time from
      VITE_SITE_URL (see vite.config.ts) — one source of truth, and nothing is
      emitted at all when no domain is configured. A canonical tag pointing at
      a domain you don't own hands your search ranking to whoever does.
    -->

    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Fonts are self-hosted; these two carry the body text. -->
    <link
      rel="preload"
      href="/fonts/inter-latin-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/inter-latin-ext-wght-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />

    <!-- Theme color (light / dark) -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f4f1ea" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1f150f" />

    <!-- iOS add-to-home-screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Skymoon GPA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Skymoon GPA" />
    <meta property="og:locale" content="tr_TR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Skymoon GPA — Not ortalamanı hesapla & simüle et" />
    <meta
      property="og:description"
      content="Koç Üniversitesi için GPA hesaplama, simülasyon ve hedef ortalama aracı."
    />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Skymoon GPA — Not ortalamanı hesapla & simüle et" />
    <meta
      name="twitter:description"
      content="Koç Üniversitesi için GPA hesaplama, simülasyon ve hedef ortalama aracı."
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Skymoon GPA",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "inLanguage": ["tr", "en"],
        "isAccessibleForFree": true,
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "TRY" },
        "description": "Koç Üniversitesi öğrencileri için GPA hesaplama, simülasyon ve hedef ortalama aracı. Veriler cihazdan çıkmaz.",
        "disambiguatingDescription": "Gayriresmî bir araçtır; Koç Üniversitesi ile bağlantısı yoktur."
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
